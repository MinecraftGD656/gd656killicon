# ============================================================
# GD656Killicon - Minecraft 26.1.2 / Fabric 构建属性
# 从 1.20.1-fabric 分支迁移
# ============================================================

org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# ---------- 游戏与工具链 ----------
# 26.1 是首个"去混淆"版本：不再需要 mappings / parchment
minecraft_version=26.1.2
# Fabric Loader 最新稳定版为 0.19.5；26.1 官方推荐最低 0.18.4
loader_version=0.19.5
# Loom：26.1 官方推荐 >= 1.15。此版本支持新的 net.fabricmc.fabric-loom 插件 id
loom_version=1.16.3

# ---------- Mod 信息 ----------
mod_version=1.3.2-26.1.2-fabric
maven_group=org.mods.gd656killicon
archives_base_name=gd656killicon-Refabricated

# ---------- 依赖 ----------
# Fabric API 26.1.2 线最新（2026-09-07 发布）
fabric_version=0.155.3+26.1.2
# Architectury API：Fabric 26.1.2 专用构建（事件 / 网络 / 平台抽象）
architectury_version=20.1.14
# Mod Menu for 26.1（可选，配置界面入口）
modmenu_version=18.0.2
# Forge Config API Port：[FABRIC][26.1.x] v26.1.5
forgeconfigapiport_version=26.1.5

# ---------- 说明 ----------
# 以下 1.20.1 时期的可选前置在 26.1.2 上均不存在，已从构建中移除：
#   tacz / superbwarfare / geckolib / trinkets / cardinal_components
# 对应代码请走 DummyXxxHandler 分支或直接删除，详见 PORTING_GUIDE.md
