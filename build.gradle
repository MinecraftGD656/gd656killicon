plugins {
    // 26.1 起使用新的未混淆 Loom 插件 id（不再 remap）
    id 'net.fabricmc.fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}"
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup "dev.architectury" }
    }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 26.1 已去混淆：不再声明 mappings（原 loom.officialMojangMappings() 已移除）
    // 26.1 未混淆工作流：modXxx -> 标准 Gradle 配置
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Architectury（事件 / 网络 / 平台抽象）—— 本 mod 的核心依赖
    implementation "dev.architectury:architectury-fabric:${project.architectury_version}"

    // Mod Menu（可选，配置界面入口）
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Forge Config API Port
    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // 注意：TACZ / SuperbWarfare / GeckoLib / Trinkets / CCA 在 26.1.2 上均无发布版，
    // 已从依赖中移除。相关代码请见 PORTING_GUIDE.md 第 4 阶段。
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// 26.1 要求 Java 25
def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
    it.options.compilerArgs << "-Xmaxerrs" << "10000"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    if (file("LICENSE").exists()) {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}"
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/mcmodsrepo" }
    }
}
