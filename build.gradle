plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}"
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        // Architectury API
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        // Forge Config API Port
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Terraformers" // ModMenu
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroupByRegex "software\\.bernie.*"
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "Ladysnake" // CCA
        url = "https://maven.ladysnake.org/releases"
    }
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Architectury API (事件/网络/平台抽象)
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"

    // ModMenu 配置界面入口
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Forge Config API Port (TACZ/SuperbWarfare Fabric 版运行时依赖)
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_version}"

    // 可选前置: TACZ-Refabricated (官方 1.21.1 发布版, 编译期依赖)
    modCompileOnly "maven.modrinth:tacz-refabricated:${project.tacz_version}"

    // 可选前置: SuperbWarfareReFabricated (社区 Fabric 移植版, 编译期依赖)
    modCompileOnly "maven.modrinth:superb-warfare-refabricated:${project.superbwarfare_version}"
    // SuperbWarfare 的传递依赖 (仅编译期)
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cardinal_components_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-item:${project.cardinal_components_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cardinal_components_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-chunk:${project.cardinal_components_version}"
    modCompileOnly "teamreborn:energy:4.1.0"

    modCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}"
            from components.java
        }
    }

    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
